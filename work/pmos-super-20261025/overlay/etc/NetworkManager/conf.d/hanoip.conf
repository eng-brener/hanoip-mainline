[keyfile]
# usb0 keeps the static 172.16.42.1 set by the initramfs (SSH/serial).
unmanaged-devices=interface-name:usb0

# WCN3990/ath10k here does not find the AP when NetworkManager changes the
# MAC for scans or connections; keep the permanent (ABL-provided) address.
[device-hanoip-wlan]
match-device=interface-name:wlan0
wifi.scan-rand-mac-address=no

[connection-hanoip-wlan]
match-device=interface-name:wlan0
wifi.cloned-mac-address=permanent
