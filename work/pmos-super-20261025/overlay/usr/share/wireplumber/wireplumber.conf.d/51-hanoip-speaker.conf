# Motorola Moto G60: open the speaker PCM as S16LE. With S24_LE (24 bits
# in 32) the q6asm path plays about 48 dB too quietly.
monitor.alsa.rules = [
  {
    matches = [
      { node.name = "~alsa_output.platform-sound.*" }
    ]
    actions = {
      update-props = {
        audio.format = "S16LE"
      }
    }
  }
]
