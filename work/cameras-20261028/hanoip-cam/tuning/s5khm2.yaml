# SPDX-License-Identifier: CC0-1.0
# S5KHM2 (hanoip rear main) - softISP simple, NOT calibrated with a chart.
# Black level measured: 64 @ 10 bits = 4096 @ 16 bits. The CCM is a generic
# moderate one (rows sum to 1, so white is unchanged) to undo the washed-out
# look of the uncalibrated profile.
%YAML 1.1
---
version: 1
algorithms:
  - BlackLevel:
      blackLevel: 4096
  - Awb:
  - Ccm:
      ccms:
        - ct: 6500
          ccm: [ 1.50, -0.35, -0.15,
                -0.25,  1.45, -0.20,
                -0.05, -0.45,  1.50 ]
  - Adjust:
  - Agc:
...
