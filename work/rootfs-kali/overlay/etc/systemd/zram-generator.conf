# hanoip: zram como swap comprimido (3,5 GB de RAM física, sem swap em disco).
# Metade da RAM (~1,8 GB) em zstd: dá folga para navegador/apps sem tocar na
# UFS e sem risco de swap em partição errada.
[zram0]
zram-size = min(ram / 2, 4096)
compression-algorithm = zstd
swap-priority = 100
fs-type = swap
