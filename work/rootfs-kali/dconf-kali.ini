[mobi/phosh/FileSelector]
icon-size=uint32 96
sort-by='name'
sort-reverse=false
thumbnail-mode='local'

[mobi/phosh/osk]
osk-features=['key-indicator']
schema-migration=uint32 1

[org/gnome/Lollypop]
