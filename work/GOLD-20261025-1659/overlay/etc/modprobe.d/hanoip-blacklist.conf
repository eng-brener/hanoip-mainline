# Hanoip: keep udev from autoloading drivers that are not validated on this
# board. Explicit `modprobe` still works for tests.
# Releases interconnect sync_state; unused-bandwidth drops can starve MDSS.
blacklist icc_bwmon
# LPASS registers may be unpowered here; access can hang the bus.
blacklist pinctrl_sm7150_lpass_lpi
# Untested SCM calls into the TEE.
blacklist qcomtee
# Would enumerate unreviewed children of the 146aa000 SRAM node.
blacklist simple_pm_bus
