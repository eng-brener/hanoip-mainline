# Motorola Moto G60 (hanoip): speaker, earpiece, headphones and microphones.
#
# PCM 0 = MultiMedia1 (playback only), PCM 4 = MultiMedia2 (capture only).
# One q6routing session keeps a single backend port, so the playback devices
# all switch the MultiMedia1 route and must conflict with each other:
#   Speaker    -> SECONDARY_MI2S_RX -> AW882xx
#   Earpiece   -> RX_CODEC_DMA_RX_0 -> rx-macro INT0 -> WCD937x RX1 -> EAR
#   Headphones -> RX_CODEC_DMA_RX_0 -> rx-macro INT0/INT1 -> WCD937x HPHL/HPHR
# Capture always uses TX_CODEC_DMA_TX_3 -> tx-macro DEC0; the microphones only
# change the DEC0 input, so they conflict with each other too. The mixer
# values follow the Android mixer_paths.xml ("handset", "headphones",
# "amic1/2/3") plus the per-port SoundWire switches mainline needs.

SectionVerb {
	EnableSequence [
		cset "name='MultiMedia2 Mixer TX_CODEC_DMA_TX_3' 1"
		cset "name='TX DEC0 MUX' SWR_MIC"
		cset "name='TX_AIF1_CAP Mixer DEC0' 1"
	]

	DisableSequence [
		cset "name='TX_AIF1_CAP Mixer DEC0' 0"
		cset "name='MultiMedia2 Mixer TX_CODEC_DMA_TX_3' 0"
	]

	Value {
		TQ "HiFi"
	}
}

SectionDevice."Speaker" {
	Comment "Speaker"

	ConflictingDevice [
		"Earpiece"
		"Headphones"
	]

	EnableSequence [
		cset "name='SEC_MI2S_RX Audio Mixer MultiMedia1' 1"
	]

	DisableSequence [
		cset "name='SEC_MI2S_RX Audio Mixer MultiMedia1' 0"
	]

	Value {
		PlaybackPriority 100
		PlaybackPCM "hw:${CardId},0"
	}
}

SectionDevice."Earpiece" {
	Comment "Earpiece"

	ConflictingDevice [
		"Speaker"
		"Headphones"
	]

	EnableSequence [
		cset "name='RX_MACRO RX0 MUX' AIF1_PB"
		cset "name='RX INT0_1 MIX1 INP0' RX0"
		cset "name='RX INT0 DEM MUX' CLSH_DSM_OUT"
		cset "name='RX_EAR Mode Switch' 1"
		cset "name='RDAC3_MUX' RX1"
		cset "name='EAR_RDAC Switch' 1"
		cset "name='HPHL Switch' 1"
		cset "name='RX_CODEC_DMA_RX_0 Audio Mixer MultiMedia1' 1"
	]

	DisableSequence [
		cset "name='RX_CODEC_DMA_RX_0 Audio Mixer MultiMedia1' 0"
		cset "name='HPHL Switch' 0"
		cset "name='EAR_RDAC Switch' 0"
		cset "name='RX_EAR Mode Switch' 0"
		cset "name='RX INT0_1 MIX1 INP0' ZERO"
		cset "name='RX_MACRO RX0 MUX' ZERO"
	]

	Value {
		PlaybackPriority 50
		PlaybackPCM "hw:${CardId},0"
	}
}

SectionDevice."Headphones" {
	Comment "Headphones"

	ConflictingDevice [
		"Speaker"
		"Earpiece"
	]

	EnableSequence [
		cset "name='RX_MACRO RX0 MUX' AIF1_PB"
		cset "name='RX_MACRO RX1 MUX' AIF1_PB"
		cset "name='RX INT0_1 MIX1 INP0' RX0"
		cset "name='RX INT1_1 MIX1 INP0' RX1"
		cset "name='RX INT0 DEM MUX' CLSH_DSM_OUT"
		cset "name='RX INT1 DEM MUX' CLSH_DSM_OUT"
		cset "name='RX HPH Mode' CLS_H_LOHIFI"
		cset "name='HPHL_RDAC Switch' 1"
		cset "name='HPHR_RDAC Switch' 1"
		cset "name='HPHL Switch' 1"
		cset "name='HPHR Switch' 1"
		cset "name='RX_CODEC_DMA_RX_0 Audio Mixer MultiMedia1' 1"
	]

	DisableSequence [
		cset "name='RX_CODEC_DMA_RX_0 Audio Mixer MultiMedia1' 0"
		cset "name='HPHL Switch' 0"
		cset "name='HPHR Switch' 0"
		cset "name='HPHL_RDAC Switch' 0"
		cset "name='HPHR_RDAC Switch' 0"
		cset "name='RX INT0_1 MIX1 INP0' ZERO"
		cset "name='RX INT1_1 MIX1 INP0' ZERO"
		cset "name='RX_MACRO RX0 MUX' ZERO"
		cset "name='RX_MACRO RX1 MUX' ZERO"
	]

	Value {
		PlaybackPriority 200
		PlaybackPCM "hw:${CardId},0"
		JackControl "Headphone Jack"
	}
}

# Main microphone: the one Android uses for calls ("handset-mic" = amic3).
SectionDevice."Mic1" {
	Comment "Internal Microphone"

	ConflictingDevice [
		"Mic2"
		"HeadsetMic"
	]

	EnableSequence [
		cset "name='TX SMIC MUX0' ADC2"
		cset "name='ADC2 MUX' INP3"
		cset "name='ADC2 Volume' 10"
		cset "name='TX_DEC0 Volume' 100"
		cset "name='ADC2_MIXER Switch' 1"
		cset "name='ADC2 Switch' 1"
	]

	DisableSequence [
		cset "name='ADC2 Switch' 0"
		cset "name='ADC2_MIXER Switch' 0"
		cset "name='TX SMIC MUX0' ZERO"
	]

	Value {
		CapturePriority 100
		CapturePCM "hw:${CardId},4"
		CaptureChannels 1
	}
}

# Second microphone (amic1), about 17 dB less sensitive to speech.
SectionDevice."Mic2" {
	Comment "Secondary Microphone"

	ConflictingDevice [
		"Mic1"
		"HeadsetMic"
	]

	EnableSequence [
		cset "name='TX SMIC MUX0' ADC0"
		cset "name='ADC1 Volume' 10"
		cset "name='TX_DEC0 Volume' 100"
		cset "name='ADC1_MIXER Switch' 1"
		cset "name='ADC1 Switch' 1"
	]

	DisableSequence [
		cset "name='ADC1 Switch' 0"
		cset "name='ADC1_MIXER Switch' 0"
		cset "name='TX SMIC MUX0' ZERO"
	]

	Value {
		CapturePriority 50
		CapturePCM "hw:${CardId},4"
		CaptureChannels 1
	}
}

SectionDevice."HeadsetMic" {
	Comment "Headset Microphone"

	ConflictingDevice [
		"Mic1"
		"Mic2"
	]

	EnableSequence [
		cset "name='TX SMIC MUX0' ADC2"
		cset "name='ADC2 MUX' INP2"
		cset "name='ADC2 Volume' 10"
		cset "name='TX_DEC0 Volume' 110"
		cset "name='ADC2_MIXER Switch' 1"
		cset "name='ADC2 Switch' 1"
	]

	DisableSequence [
		cset "name='ADC2 Switch' 0"
		cset "name='ADC2_MIXER Switch' 0"
		cset "name='TX SMIC MUX0' ZERO"
	]

	Value {
		CapturePriority 200
		CapturePCM "hw:${CardId},4"
		CaptureChannels 1
		JackControl "Mic Jack"
	}
}
