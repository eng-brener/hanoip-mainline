# Motorola Moto G60: open the speaker PCM as S16LE. With S24_LE (24 bits
# in 32) the q6asm path plays about 48 dB too quietly.
# session.suspend-timeout-seconds = 0 keeps the sink awake: with the default
# 5 s the first sound after silence waited for the DSP to resume (audible
# delay). node.latency trims the buffering a bit (ADSP path tolerates it).
monitor.alsa.rules = [
  {
    matches = [
      { node.name = "~alsa_output.platform-sound.*" }
    ]
    actions = {
      update-props = {
        audio.format = "S16LE"
        session.suspend-timeout-seconds = 0
        node.latency = "1024/48000"
      }
    }
  }
]
