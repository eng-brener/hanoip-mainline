---

stages:
  - lint
  - build_push_container

# - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - -

#
## Lint
#

.lint:
  stage: lint
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_COMMIT_MESSAGE !~ /^Merge branch/'
    - when: manual

shellcheck:
  extends: .lint
  ## REF: https://hub.docker.com/r/koalaman/shellcheck-alpine
  ##      https://github.com/koalaman/shellcheck/wiki/GitLab-CI
  ## Not pin'd version
  image: docker.io/koalaman/shellcheck-alpine:stable
  before_script:
    - apk add --no-cache git jq gawk
    - mkdir -pv ./reports/
  script:
    - apk add bash
    - bash -n ./build.sh || exit 1
    - bash -n ./build-in-container.sh || exit 1
    #- shellcheck ./build.sh ./build-in-container.sh ./scripts/*
    - |
      ## Skip symlinks (120000)
      git ls-files -s -z \
        | gawk -v RS='\0' -v ORS='\0' '$1 != "120000" { sub(/^[^\t]*\t/, ""); print }' \
        | xargs -0 gawk -vORS='\0' 'FNR==1 && /^#!.*sh/ { print FILENAME; nextfile }' \
        | { xargs -0r shellcheck -f json || true; } \
        | jq '[.[] | {
            description: .message,
            check_name: ("SC" + (.code|tostring)),
            fingerprint: (.file + ":" + (.line|tostring) + ":" + (.column|tostring) + ":SC" + (.code|tostring)),
            severity: (if .level=="error" then "major" elif .level=="warning" then "minor" else "info" end),
            location: { path: .file, lines: { begin: .line } }
          }]' > ./reports/codequality.json
    ## Fail the job if anything was found (Method #1)
    #- test "$( jq 'length' ./reports/codequality.json )" = "0"
    ## Fail the job on errors only, warning/info/style pass (Method #1.1) - Due to upstream code
    - test "$( jq '[.[] | select(.severity == "major")] | length' ./reports/codequality.json )" = "0"
  artifacts:
    when: always
    paths:
      - ./reports/
    expire_in: 1 week
    reports:
      codequality: reports/codequality.json

yamllint:
  extends: .lint
  ## REF: https://hub.docker.com/_/python
  ##      https://yamllint.readthedocs.io/en/stable/integration.html
  ## Alt:
  ##   image: python.io/docker:slim
  ##   image: python:slim
  ## Not pin'd version
  image: docker.io/library/python:slim
  before_script:
    - pip install yamllint
    - mkdir -pv ./reports/
  script:
    - |
      ec=0
      yamllint -f parsable . > ./reports/yamllint.txt || ec=$?
      [ "$ec" = "0" ] || [ "$ec" = "1" ] || { cat ./reports/yamllint.txt; exit 1; }
    - |
      python3 <<'EOF' > ./reports/codequality.json
      import json, re, sys
      issues = []
      for line in open("./reports/yamllint.txt"):
          m = re.match(r"(.+?):(\d+):(\d+): \[(warning|error)\] (.+) \((.+)\)\s*$", line)
          if m:
              path, ln, col, level, msg, rule = m.groups()
              issues.append({
                  "description": msg,
                  "check_name": rule,
                  "fingerprint": f"{path}:{ln}:{col}:{rule}",
                  "severity": "major" if level == "error" else "minor",
                  "location": {"path": path, "lines": {"begin": int(ln)}}
              })
      json.dump(issues, sys.stdout)
      EOF
    ## Fail the job if anything was found (Method #2)
    - test "$( python3 -c 'import json; print(len(json.load(open("./reports/codequality.json"))))' )" = "0"
  artifacts:
    when: always
    paths:
      - ./reports/
    expire_in: 1 week
    reports:
      codequality: ./reports/codequality.json

hadolint:
  extends: .lint
  ## REF: https://hub.docker.com/r/hadolint/hadolint
  ##   Alt: ghcr.io/hadolint/hadolint:latest-debian
  ## Not pin'd version
  image: docker.io/hadolint/hadolint:latest-debian
  before_script:
    - mkdir -pv ./reports/
  script:
    - hadolint --format gitlab_codeclimate Dockerfile* > ./reports/codequality.json || true
    ## Fail the job if anything was found (Method #3)
    - test "$( cat ./reports/codequality.json )" = "[]"
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes: &hadolint_paths
        - .gitlab-ci.yml
        - Dockerfile*
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_COMMIT_MESSAGE !~ /^Merge branch/'
      changes: *hadolint_paths
    - when: manual
  artifacts:
    when: always
    paths:
      - ./reports/
    expire_in: 1 week
    reports:
      codequality: ./reports/codequality.json

# - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - -

#
## Build & Push container image
#

.build_container:
  stage: build_push_container
  ## REF: https://hub.docker.com/_/docker
  ## Alt:
  ##   image: docker.io/docker:latest
  ##   image: docker:latest
  ## Not pin'd version
  image: docker.io/library/docker:latest
  ## "Docker IN Docker (DIND)" as building on GitLab.com SaaS, which are using Docker runners
  ##   Not pin'd version
  services:
    - docker:dind
  before_script:
    - docker info   # Alt: docker version
  script:
    ## Due to GitLab CI limitation, can't do this in "variables"
    ##   As well as the job having to start with a letter (can't do just numbers for the version)
    - CONTAINER_IMAGE=${CI_PROJECT_NAME}
    - CONTAINER_TAG=${CI_JOB_NAME/build-}   # aka "latest"
    ## Build
    - docker build --tag "${CONTAINER_IMAGE}:${CONTAINER_TAG}" .
    ## Check
    - docker images
    ## Login
    - echo "${CI_REGISTRY_PASSWORD}" | docker login --password-stdin --username "${CI_REGISTRY_USER}" "${CI_REGISTRY}"   # Alt: ${CI_JOB_TOKEN}
    ## Rename/retag local tag, for remote registry
    - docker tag "${CONTAINER_IMAGE}:${CONTAINER_TAG}" ${CI_REGISTRY_IMAGE}:${CONTAINER_TAG}
    ## Upload
    - docker push                                    "${CI_REGISTRY_IMAGE}:${CONTAINER_TAG}"
  ## Due to GitLab CI limitation, if script passes, but anything fails in after_script, will return success
  after_script:
    - shred -fv /root/.docker/config.json || true
    - CONTAINER_TAG=${CI_JOB_NAME/build-}   # aka "latest"
    - echo "[i] Check ${CI_PROJECT_URL}/container_registry"
    - echo "$ docker pull ${CI_REGISTRY_IMAGE}:${CONTAINER_TAG}"
    - echo "$ podman pull ${CI_REGISTRY_IMAGE}:${CONTAINER_TAG}"

build-latest:
  extends:
    - .build_container
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
    - when: manual

# - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - -
