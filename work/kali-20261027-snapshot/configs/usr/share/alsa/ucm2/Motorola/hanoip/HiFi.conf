# Motorola Moto G60 (hanoip): speaker only for now.
# MultiMedia1 (PCM 0) -> SECONDARY_MI2S_RX -> Awinic AW882xx amplifier.

SectionVerb {
	EnableSequence [
		cset "name='SEC_MI2S_RX Audio Mixer MultiMedia1' 1"
	]

	Value {
		TQ "HiFi"
	}
}

SectionDevice."Speaker" {
	Comment "Speaker"

	Value {
		PlaybackPriority 100
		PlaybackPCM "hw:${CardId},0"
		PlaybackChannels 1
	}
}
