%YAML 1.2
---
$id: http://devicetree.org/schemas/display/panel/ilitek,ili7807s.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Ilitek ILI7807S-based DSI panel

maintainers:
  - Arpit Saini <asaini@codeaurora.org>

allOf:
  - $ref: panel-common.yaml#

properties:
  compatible:
    enum:
      - dlc,dlc0697
      - tianma,ili7807s-hanoip

  reg:
    maxItems: 1

  vddi-supply: true
  avdd-supply: true
  avee-supply: true

required:
  - compatible
  - reg
  - vddi-supply
  - avdd-supply
  - avee-supply
  - reset-gpios

unevaluatedProperties: false

examples:
  - |
    #include <dt-bindings/gpio/gpio.h>

    dsi {
      #address-cells = <1>;
      #size-cells = <0>;

      panel@0 {
        compatible = "tianma,ili7807s-hanoip";
        reg = <0>;

        vddi-supply = <&vreg_l13a_1p8>;
        avdd-supply = <&vreg_lab>;
        avee-supply = <&vreg_ibb>;

        reset-gpios = <&pm6150l_gpios 9 GPIO_ACTIVE_LOW>;

        port {
          panel_in: endpoint {
            remote-endpoint = <&dsi0_out>;
          };
        };
      };
    };
...
